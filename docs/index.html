*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);line-height:1.65}a{color:inherit;text-underline-offset:4px}a:focus-visible{outline:2px solid var(--fg);outline-offset:5px}main,header,footer{max-width:1080px;margin:auto;padding:0 40px}header{padding-top:32px;display:flex;justify-content:space-between;align-items:center;font-size:12px;letter-spacing:.12em}header a{text-decoration:none}.edition{color:var(--muted)}nav{display:flex;gap:24px}.hero{padding:86px 0 52px;border-bottom:1px solid var(--line)}.wordmark{width:min(100%,650px);display:block;margin:0 0 42px}.wordmark img{width:100%;display:block}h1{font-size:clamp(30px,5vw,52px);line-height:1.3;font-weight:500;letter-spacing:-.045em;margin:0 0 20px;white-space:pre-line}.intro{color:var(--muted);max-width:610px;margin:0;font-size:17px;word-break:keep-all}.version{font-size:12px;letter-spacing:.08em;color:var(--muted);margin:28px 0 0}.installs{margin:30px 0 0;display:flex;gap:14px;flex-wrap:wrap}.action{display:block;min-width:220px;border-radius:7px;border:1px solid var(--fg);text-align:center;text-decoration:none;padding:14px 28px;font-size:14px;font-weight:600;background:var(--button);color:var(--button-text)}.action.secondary{background:transparent;color:var(--fg)}.action:hover{opacity:.8}.links{display:flex;gap:24px;padding:27px 0 40px;font-size:14px;flex-wrap:wrap}footer{padding-top:24px;padding-bottom:32px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:24px;font-size:12px;color:var(--muted)}footer img{display:block;width:110px}
@media(prefers-color-scheme:dark){:root{--bg:#111110;--fg:#f4f2ee;--muted:#aaa7a0;--line:#383733;--surface:#191918;--button:#f4f2ee;--button-text:#191919}}
@media(max-width:760px){main,header,footer{padding-left:24px;padding-right:24px}.hero{padding-top:58px}.wordmark{margin-bottom:32px}.action{min-width:0;flex:1 1 100%}.links,footer{flex-wrap:wrap}.edition{letter-spacing:.06em}.intro{font-size:16px}}

<script>
const english = new URLSearchParams(location.search).get('lang') === 'en';
const translations = {
 title:'A place for what you read.\nA home for what you love.',
 intro:'Discover comics and illustrations, enjoy them, and build your own collection.',
 appStore:'Download on the App Store ↗',googlePlay:'Get it on Google Play ↗',

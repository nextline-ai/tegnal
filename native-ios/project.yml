name: TEGNAL
options:
  developmentLanguage: en
  bundleIdPrefix: work.nextline
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  postGenCommand: python3 ../script/sync_test_plan_ids.py

settings:
  base:
    DEVELOPMENT_TEAM: 6HV24C77H5
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    from: "6.29.3"

targets:
  TEGNAL:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: TEGNAL
      - path: AppIcon.icon
      - path: Shared
    dependencies:
      - package: GRDB
      - target: ShareExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: work.nextline.tegnal
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
        SUPPORTS_MACCATALYST: NO
        INFOPLIST_FILE: TEGNAL/Info.plist
        CODE_SIGN_ENTITLEMENTS: TEGNAL/TEGNAL.entitlements
        CURRENT_PROJECT_VERSION: 27
        MARKETING_VERSION: "2.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.entertainment
        GENERATE_INFOPLIST_FILE: false
        SWIFT_VERSION: "5.10"
        ENABLE_USER_SCRIPT_SANDBOXING: false
        DEVELOPMENT_TEAM: 6HV24C77H5
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"

  ShareExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ShareExtension
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: work.nextline.tegnal.share
        INFOPLIST_FILE: ShareExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: ShareExtension/ShareExtension.entitlements
        CURRENT_PROJECT_VERSION: 27
        MARKETING_VERSION: "2.0"
        GENERATE_INFOPLIST_FILE: false
        SWIFT_VERSION: "5.10"
        DEVELOPMENT_TEAM: 6HV24C77H5
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"

  TEGNALTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TEGNALTests
    dependencies:
      - target: TEGNAL
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: work.nextline.tegnal.tests
        GENERATE_INFOPLIST_FILE: true
        SWIFT_VERSION: "5.10"
        DEVELOPMENT_TEAM: 6HV24C77H5
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"

  TEGNALUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: TEGNALUITests
    dependencies:
      - target: TEGNAL
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: work.nextline.tegnal.uitests
        GENERATE_INFOPLIST_FILE: true
        SWIFT_VERSION: "5.10"
        DEVELOPMENT_TEAM: 6HV24C77H5
        CODE_SIGN_STYLE: Automatic
        TEST_TARGET_NAME: TEGNAL

schemes:
  TEGNAL:
    build:
      targets:
        TEGNAL: all
    test:
      testPlans:
        - path: TestPlans/Smoke.xctestplan
          defaultPlan: true
        - path: TestPlans/Unit.xctestplan
        - path: TestPlans/UI.xctestplan
  NativeContentDeviceValidation:
    build:
      targets:
        TEGNAL: all
    test:
      targets: [TEGNALTests, TEGNALUITests]
      environmentVariables:
        TEGNAL_LIVE_TESTS: "1"
  BooruDeviceValidation:
    build:
      targets:
        TEGNAL: all
    test:
      targets: [TEGNALTests, TEGNALUITests]
      environmentVariables:
        TEGNAL_BOORU_LIVE_TESTS: "1"
        TEGNAL_LEGACY_SERVERS: "$(TEGNAL_LEGACY_SERVERS)"

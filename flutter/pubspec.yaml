name: tegnal
description: Android version of the native TEGNAL app.
publish_to: none
version: 1.6.1+21
environment:
  sdk: ^3.14.0

dependencies:
  characters: ^1.4.0
  collection: ^1.19.1
  crypto: ^3.0.7
  cupertino_icons: ^2.0.0
  cupertino_ui: 1.1.7
  file_selector_linux: ^0.9.4+1
  file_selector_macos: ^0.9.5+2
  file_selector_platform_interface: ^2.7.0
  file_selector_windows: ^0.9.3+6
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  google_sign_in: ^7.2.0
  google_sign_in_platform_interface: ^3.1.0
  http: ^1.6.0
  media_kit_libs_linux: ^1.2.1
  media_kit_libs_windows_video: ^1.0.11
  path_provider: ^2.1.6
  pointycastle: ^4.0.0
  shared_preferences: ^2.5.6
  sqlite3: ^3.9.1
  url_launcher: ^6.3.3
  video_player: ^2.14.1
  video_player_media_kit: ^2.0.0
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/l10n/
    - assets/developer/
    - assets/legal/
    - assets/study/
    - assets/study/mascot/
    - assets/study/sounds/
    - assets/home/
    - assets/home/art/
  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/PretendardVariable.ttf
    - family: Pretendard JP
      fonts:
        - asset: assets/fonts/PretendardJPVariable.ttf

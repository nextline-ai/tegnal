name: tegnal
description: Android version of the native TEGNAL app.
publish_to: none
version: 1.4.0+10
environment:
  sdk: ^3.13.7

dependencies:
  characters: ^1.4.0
  collection: ^1.19.1
  crypto: ^3.0.7
  cupertino_icons: ^2.0.0
  cupertino_ui: 1.1.5
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  google_sign_in: ^7.2.0
  http: ^1.6.0
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  sqlite3: ^3.8.0
  url_launcher: ^6.3.3
  video_player: ^2.14.1
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/l10n/
    - assets/developer/
    - assets/legal/
  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/PretendardVariable.ttf
    - family: Pretendard JP
      fonts:
        - asset: assets/fonts/PretendardJPVariable.ttf
